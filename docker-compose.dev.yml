services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cosimi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cosimi
    ports:
      - "5432:5432"
    volumes:
      - cosimi_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosimi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosimi_pg_data:
