  response: "kiểu thấy người ta hơn mình rồi cay, gato đó bạn."
  topic: "slang-def"
- input: "đừng có gato"
  response: "biết rồi, gato gì mà gato, sống vui đi cho khoẻ"
  topic: "slang-react"
- input: "gato vậy"
  response: "gato gì, mình mừng cho người ta thôi mà =))"
  topic: "slang-react"
- input: "gato quá"
